# - Keybindings -

# Set prefix key to 'C-t'
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# Hotkey to reload tmux config
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Emacs-style window keys (C-x 1/2/3/0); these replace selecting windows 1, 2,
# 3, 0. 1 zooms (toggles) rather than closing the other panes.
bind 1 resize-pane -Z
bind 2 split-window -v
bind 3 split-window -h
bind 0 kill-pane

# - UI -

# Status bar
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style "bg=default,fg=brightblack"
set -g status-left-length 40
# Session name; black on green while the prefix key is pressed. Padded the
# same either way so nothing shifts.
set -g status-left "#{?client_prefix,#[bg=yellow#,fg=black],#[fg=brightblack]}#S #[default]"
set -g status-right ""

# Window status
set -g window-status-separator " 󰇘 "
set -g window-status-style "bg=default,fg=brightblack"
set -g window-status-current-style default
set -g window-status-format " #W "
set -g window-status-current-format "#[fg=blue,bg=black]  #W #[fg=blue]#{?window_zoomed_flag, ,}"
set -g window-status-bell-style "bg=cyan,fg=black,bold"
set -g window-status-activity-style "bg=white,fg=black"

# Panes
set -g pane-border-style "fg=black"
set -g pane-active-border-style "fg=brightblack"
set -g pane-border-indicators arrows

# Misc
set -g message-style "bg=default,fg=white"
